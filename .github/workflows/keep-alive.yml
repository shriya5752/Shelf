name: Keep Shelf awake

# Visits the site's health route every few days. The route reads one row from Supabase, which counts as
# activity, so the free project isn't paused for being idle. Also shows up red here if the site is down.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the site and database
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 10 --max-time 30 \
            https://shelf-shshs12.vercel.app/api/health
